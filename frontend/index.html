<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ModuLab</title>
    <!-- Best-effort pre-paint dark-mode guess, before React mounts - see
         public/theme-init.js for the full rationale. Loaded as an external
         file (not inline) because Core's CSP (deploy/nginx.conf) only allows
         'self' + blob: for script-src, no 'unsafe-inline'/nonce - an inline
         <script> here would be silently blocked by the browser. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 130 120'%3E%3Cpolygon points='35,8 64,24 64,57 35,73 6,57 6,24' fill='%231f2d3d'/%3E%3Cpolygon points='65,40 94,56 94,89 65,105 36,89 36,56' fill='%230084a8'/%3E%3Cpath d='M57,58 L73,58 L73,70 C73,76 65,80 65,80 C65,80 57,76 57,70 Z' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M65,74 L65,63 M61,67 L65,63 L69,67' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- "Add to Home Screen" support. manifest.webmanifest itself is
         injected by vite-plugin-pwa (see vite.config.ts) - the tags below
         are the ones iOS Safari specifically needs, since it ignores the
         web manifest's icons/display mode entirely and has no
         beforeinstallprompt API of its own (see AppShell.tsx's
         useInstallPrompt hook for the Android-vs-iOS split this feeds). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ModuLab" />
    <meta name="theme-color" content="#1f2d3d" />
    <!-- Tabler Icons webfont is now self-hosted (@tabler/icons-webfont,
         imported in src/main.tsx) rather than loaded from
         cdnjs.cloudflare.com here - see main.tsx's import comment and
         nginx.conf's CSP comment for the full rationale (no third-party
         request per page load, no CSP style-src/font-src exception needed,
         and the earlier "missing SRI" review finding is moot once the
         resource is same-origin). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
