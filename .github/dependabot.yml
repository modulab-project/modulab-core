version: 2

# Keeps every dependency this project actually manages on a weekly update
# cadence, across all four places a version can go stale: Go modules,
# npm packages, the two Dockerfiles' pinned base images, and the GitHub
# Actions used by ci.yml itself. govulncheck/npm audit/Trivy (see ci.yml)
# only catch a *known, published* vulnerability in whatever is already
# pinned - they say nothing about a dependency simply being outdated. This
# is the other half: it opens the PR that lets a new version get in at all,
# which the "always use the latest stable version" project convention
# otherwise relies on someone remembering to check for by hand.
updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "backend"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "frontend"

  # The root Dockerfile pins node:24-alpine, golang:1.26-alpine, and
  # debian:bookworm-slim as base images, plus the Deno/Cosign versions
  # baked in via ENV - Dependabot only tracks the FROM lines here, not the
  # curl-downloaded ENV-pinned versions, which stay a manual bump (see
  # Dockerfile's own version-pin comments).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"

  # deploy/docker-compose.yml. This needs its own entry: "docker" above only
  # parses Dockerfiles, Compose files are a separate ecosystem (GA since
  # 2025-02), so the stack's images were tracked by nothing at all until this
  # was added - the digests pinned in the 2026-07-23 security pass would have
  # sat there going stale indefinitely.
  #
  # Every image there except our own two is written as tag@sha256:... on
  # purpose (see that file's comments); Dependabot updates the tag and the
  # digest together, which is what keeps those pins reproducible *and*
  # current instead of just frozen. Note it only refreshes digests that are
  # already present - it never adds one, so tecnativa/docker-socket-proxy
  # needs its digest filled in by hand once before it is covered here too.
  #
  # ghcr.io/modulab-project/modulab-core:latest is deliberately unpinned and
  # deliberately not a Dependabot concern: it is published by our own release
  # pipeline, where `docker compose pull` is the intended upgrade path.
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deploy"

  # Keeps the actions pinned in ci.yml (actions/checkout, setup-go,
  # golangci-lint-action, trivy-action, etc.) current - several of those
  # are pinned to an exact release tag deliberately (see ci.yml's comments
  # on trivy-action and golangci-lint-action) precisely so their behavior
  # doesn't drift under an unpinned branch ref; Dependabot is how that pin
  # still gets moved forward instead of silently going stale forever.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
