# Verifies the root Dockerfile still builds on every PR/push, without
  # publishing anything - closes the gap that otherwise only surfaces at
  # release time via publish-image-build (e.g. Dockerfile drift, a Go/npm
  # dependency bump breaking the build stage, base-image digest bumps like
  # PR #13/#12). amd64 only: both build stages (go build, npm run build)
  # are pure Go/JS with no CGO or native postinstall binaries tied to a
  # specific arch, so an amd64 success is a reliable proxy for arm64 -
  # actually building both here would mean either QEMU (measured at
  # 10m14s of 12m28s for this same Dockerfile in publish-image-build) or
  # a second native runner leg on every PR, neither of which buys much
  # for a check that's meant to be fast feedback, not a release gate.
  docker-build-check:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # Deliberately no docker/login-action step here - this job has no
      # credentials to push with even if push were accidentally set to true.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: modulab-core:ci-${{ github.sha }}
