name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Publishing a GitHub Release is the point this project's own release
  # process (bump the manifest version, commit, then create the release/tag
  # by hand - see README/project docs) already treats as "this version is
  # official". The publish-image job below hooks into exactly that moment
  # rather than adding a new step to the process: nothing here runs
  # automatically on every push to main, only when a release is published.
  release:
    types: [published]

# Cancels a still-running run on the same branch/PR as soon as a newer push
# lands, instead of letting both finish - avoids burning runner minutes on a
# commit that's already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Reads the exact version straight from go.mod's own "go" line
          # instead of a hardcoded value here - single source of truth, no
          # second place to remember to bump. This replaces an earlier
          # hardcoded "1.26" that silently resolved to a stale cached
          # go1.26.4 even after go.mod required >= 1.26.5 (GOTOOLCHAIN=local
          # blocks auto-fetching a newer toolchain to cover a gap like that).
          # go-version-file + check-latest below closes both problems: it
          # always matches go.mod, and it always fetches rather than
          # settling for whatever happens to be cached on the runner.
          go-version-file: backend/go.mod
          check-latest: true
          # Caches ~/go/pkg/mod between runs (module download cache, separate
          # from the Docker layer cache in publish-image-build below) - saves
          # the go mod download step on every PR/push instead of just
          # releases. cache-dependency-path is required here: setup-go's
          # cache feature looks for go.sum at the repo root by default, but
          # this repo's go.sum lives under backend/ - without this, cache
          # restore silently fails every run ("Dependencies file is not
          # found ... Supported file pattern: go.mod") and caching never
          # actually kicks in. Found in the first run after adding `cache:
          # true` (2026-07-27, run #532): the warning showed up but the job
          # still passed, so it would have gone unnoticed without checking.
          cache: true
          cache-dependency-path: backend/go.sum
      # v6 + no explicit version installs golangci-lint v1.64.8, which was
      # itself built with go1.24 - it refuses to lint code targeting a newer
      # Go version than it was built with ("the Go language version (go1.24)
      # used to build golangci-lint is lower than the targeted Go version").
      # v9 + pinning a v2.x release (built with newer Go) is what actually
      # supports the go-version above.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          working-directory: backend
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      # Catches known-vulnerable dependencies actually reachable from this
      # codebase's own call graph (govulncheck only flags a CVE if code here
      # calls into the vulnerable function - not just "this dep is in
      # go.sum somewhere"). Added after this exact gap let two real,
      # reachable CVEs sit in go.mod during the V1 hardening pass
      # (GO-2026-5004 in jackc/pgx, GO-2025-3540 in redis/go-redis) until a
      # manual local run happened to catch them.
      # Pinned (not @latest) to match this workflow's pinning style
      # elsewhere - @latest would silently pick up a new govulncheck version
      # on every run instead of only when bumped deliberately. Confirmed
      # current stable via `go run golang.org/x/vuln/cmd/govulncheck@latest
      # -version` locally on 2026-07-27: govulncheck@v1.6.0.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Matches the Dockerfile's frontend-builder stage (node:26-alpine)
          # - keeps the lint/test/build steps here running on the same Node
          # major version that actually builds the shipped image, instead of
          # letting the two drift silently.
          node-version: 26
          # Caches npm's download cache keyed on package-lock.json - saves
          # the npm ci step on every PR/push, separate from the Docker layer
          # cache in publish-image-build below.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # eslint.config.js (flat config, ESLint 10) added during the pre-V1
      # review pass: js.configs.recommended + typescript-eslint recommended
      # + eslint-plugin-react-hooks + eslint-plugin-jsx-a11y. This blocks
      # the build on real findings now (e.g. it would have caught the
      # alt="" accessibility gaps and a missing useEffect cleanup found by
      # hand during that review) instead of relying on manual audit passes.
      - name: Lint
        run: npm run lint
      - name: Test (not implemented - see step comment)
        continue-on-error: true
        run: |
          echo "::warning::Frontend unit tests are not implemented yet (no test runner or test files in frontend/). This step intentionally fails so CI does not show a false green check."
          exit 1
      - run: npm run build
      - name: a11y checks (axe-core) (not implemented - see step comment)
        continue-on-error: true
        run: |
          echo "::warning::a11y checks are not implemented yet (no axe-core setup in frontend/). This step intentionally fails so CI does not show a false green check."
          exit 1
      # --audit-level=high: dev-dependency low/moderate advisories are noisy
      # and common (build tooling, not shipped to users); high/critical in
      # anything actually bundled is worth failing CI over.
      - name: npm audit
        run: npm audit --audit-level=high

  # Verifies the root Dockerfile still builds on every PR/push, without
  # publishing anything - closes the gap that otherwise only surfaced at
  # release time via publish-image-build below (e.g. Dockerfile drift, a
  # Go/npm dependency bump breaking a build stage, base-image digest bumps
  # like PR #13/#12). Gated on backend/frontend passing first: no point
  # spending a Docker build on a commit that's already broken elsewhere.
  # amd64 only: both build stages (go build, npm run build) are pure Go/JS
  # with no CGO or native postinstall binaries tied to a specific arch, so
  # an amd64 success is a reliable proxy for arm64 - actually building both
  # here would mean either QEMU (measured at 10m14s of 12m28s for this same
  # Dockerfile in publish-image-build below) or a second native runner leg
  # on every PR, neither of which buys much for a check that's meant to be
  # fast feedback, not a release gate. The real multi-arch build still gets
  # exercised for real at release time by publish-image-build.
  docker-build-check:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Skipped on the release event: publish-image-build below already does
    # the real (multi-arch, pushed) build at that point, so running this
    # amd64-only, no-push build alongside it would just burn runner minutes
    # on a redundant check.
    if: github.event_name != 'release'
    permissions:
      contents: read
    # Postgres and Valkey backing the smoke-boot check below. Same
    # image+digest pins as deploy/docker-compose.yml's postgres/valkey
    # services, so this is testing against the same versions production
    # actually runs, not whatever :latest happens to resolve to on a given
    # day. Published on the runner's own localhost (not a Docker network),
    # since the app container below joins the runner's network directly via
    # --network host to reach them - GitHub-hosted job steps that run
    # directly on the runner (no `container:` block on this job) always see
    # service containers on localhost, this just extends that to the
    # container the build step below produces.
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: modulab
          POSTGRES_USER: modulab
          POSTGRES_PASSWORD: modulab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modulab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # Deliberately no docker/login-action step here - this job has no
      # credentials to push with even if push were accidentally set to true.
      # load: true (new) pulls the built image into the runner's local
      # `docker images` so the smoke-boot step below can `docker run` it -
      # without it, buildx's container driver keeps the result inside its
      # own builder and `docker run` would fail with "no such image".
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: modulab-core:ci-${{ github.sha }}
      # Boots the image just built against real Postgres/Valkey and polls
      # the unauthenticated GET /healthz until it reports healthy or the
      # 60s budget runs out. This is deliberately NOT a login/OIDC flow
      # test (see the e2e job's doc comment above for why that needs a
      # mock IdP and is intentionally deferred) - it only proves the
      # container actually starts, connects to its dependencies, and
      # serves traffic, which catches Dockerfile/entrypoint/startup
      # regressions the Go/npm unit tests above can't see (e.g. a broken
      # entrypoint.sh chown, a missing binary in the final image stage, a
      # config regression that panics before the HTTP server binds).
      # MODULAB_MASTER_KEY only needs to be valid hex of the right length
      # here, not secret - this container is destroyed at the end of the
      # job and never holds real data.
      - name: Start container and wait for /healthz
        run: |
          docker run -d --name modulab-core-smoke \
            --network host \
            -e MODULAB_MASTER_KEY="$(openssl rand -hex 32)" \
            -e MODULAB_DB_HOST=localhost \
            -e MODULAB_DB_PORT=5432 \
            -e MODULAB_DB_NAME=modulab \
            -e MODULAB_DB_USER=modulab \
            -e MODULAB_DB_PASSWORD=modulab \
            -e MODULAB_VALKEY_HOST=localhost \
            -e MODULAB_VALKEY_PORT=6379 \
            modulab-core:ci-${{ github.sha }}

          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/healthz.json -w '%{http_code}' http://localhost:8080/healthz || echo 000)
            [ "$code" = "200" ] && break
            sleep 2
          done

          echo "Last /healthz response (HTTP $code):"
          cat /tmp/healthz.json 2>/dev/null || echo "(no body)"

          if [ "$code" != "200" ]; then
            echo "::error::modulab-core did not become healthy within 60s (last HTTP code: $code)"
            docker logs modulab-core-smoke
            exit 1
          fi

          # "ok" or "degraded" both mean the HTTP layer and Postgres are
          # up - see healthStatus's doc comment in main.go for why a
          # Valkey-only outage is "degraded" rather than an error. Only
          # "error" (Postgres unreachable) should fail this check.
          status=$(jq -r '.status' /tmp/healthz.json)
          if [ "$status" != "ok" ] && [ "$status" != "degraded" ]; then
            echo "::error::unexpected /healthz status: $status"
            docker logs modulab-core-smoke
            exit 1
          fi
      # Runs even if the step above failed, so a broken boot still leaves
      # its logs visible in the job output for debugging - without
      # `if: always()` a failed health check would skip straight to the
      # job's failure summary with no container output attached.
      - name: Show container logs
        if: always()
        run: docker logs modulab-core-smoke || true
      - name: Stop container
        if: always()
        run: docker rm -f modulab-core-smoke || true

  # Deliberately not implemented yet - see the decision below before adding
  # real Playwright coverage here.
  #
  # `echo "TODO: ..."` always exits 0, so this job used to show a plain green
  # check next to backend/frontend - indistinguishable from "tests passed" to
  # anyone glancing at CI status, even though zero tests actually ran.
  # continue-on-error below keeps that (a step that fails on purpose still
  # lets the job - and any check depending on it - complete), but GitHub now
  # renders it with a "failed but continued" warning icon instead of a plain
  # check, so the gap is visible rather than silently hidden.
  #
  # Why there's still no real test here: every route in this app sits behind
  # OIDC login (spec section 3.3) - there is no local username/password path
  # to script around. A real E2E smoke test therefore needs an OIDC provider
  # to log in against, and running one in CI means standing up a lightweight
  # mock IdP (e.g. Dex or mock-oauth2-server) alongside Playwright and the
  # Postgres/Valkey testcontainers already needed - a genuinely new piece of
  # test infrastructure, not just a test file. For a solo homelab project
  # without external CI/CD pressure, that setup and its ongoing upkeep isn't
  # worth it yet - revisit once there are outside contributors, or once a
  # login/setup-wizard regression actually slips through undetected more than
  # once (see the news-feed encryption bug this same testing gap let through
  # during the V1 hardening pass).
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Playwright smoke tests (not implemented - see job comment)
        continue-on-error: true
        run: |
          echo "::warning::E2E smoke tests are not implemented yet (Setup Wizard, login flow, module installation - spec section 13.3). This step intentionally fails so CI does not show a false green check."
          exit 1

  # Runs only when a GitHub Release is published (see the `on: release`
  # trigger above) - never on a plain push to main. Builds this repo's own
  # root Dockerfile (the same multi-stage build reset-and-test.sh runs
  # locally) and pushes it to ghcr.io tagged with the release's tag name
  # (e.g. "v0.2.0") and "latest", so docker-compose.yml's
  # ghcr.io/modulab-project/modulab-core:latest reference resolves to a real,
  # pullable image for anyone who is not building locally themselves.
  # GITHUB_TOKEN is sufficient to push to this repo's own ghcr.io package -
  # no extra secret needed - but the job needs "packages: write" explicitly
  # since the default token permissions are read-only.
  # Builds each platform natively instead of emulating arm64 with QEMU on an
  # amd64 runner (as this used to do): the Dockerfile's go-builder and
  # frontend-builder stages are genuine compile steps (go build, tsc + vite
  # build), and QEMU's per-instruction translation overhead hits exactly
  # those hardest - measured at 10m14s of this job's 12m28s total run time
  # in release #532 (2026-07-23), against ~1 minute each for the backend/
  # frontend jobs' equivalent native compiles. `ubuntu-24.04-arm` is a
  # GitHub-hosted runner (free for this public repo, unlike a private repo
  # where arm64 runners are billed) that runs the arm64 leg at roughly the
  # same speed as amd64 runs its own leg, in parallel instead of serialized
  # under one emulated builder.
  #
  # Each matrix leg pushes its single-platform image by digest only (no
  # tag) - `push-by-digest: true` - because a shared tag like `:latest`
  # pushed twice from two parallel jobs would just have the second push
  # silently overwrite the first with a single-platform image, not merge
  # them. publish-image-merge below combines both digests into one real
  # multi-platform manifest under the actual tags.
  publish-image-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [backend, frontend]
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/modulab-project/modulab-core,push-by-digest=true,name-canonical=true,push=true
      # Digest artifacts are how the merge job below learns what each
      # parallel leg actually pushed - the filename (not its contents, the
      # file itself is empty) carries the digest.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Sanitize platform name for artifact key
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-core-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image-merge:
    runs-on: ubuntu-latest
    needs: [publish-image-build]
    if: github.event_name == 'release'
    permissions:
      # write (not read) because the SBOM step below attaches a file to
      # this same GitHub Release via `gh release upload` - packages: write
      # alone only covers the ghcr.io push.
      contents: write
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-core-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Combines the amd64 and arm64 digests pushed separately above into one
      # multi-platform manifest list under the real tags - this is the step
      # that actually makes `docker pull ghcr.io/.../modulab-core:latest`
      # resolve to the right image per-architecture again.
      - name: Create manifest list and push (ghcr.io)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/modulab-project/modulab-core:latest \
            -t ghcr.io/modulab-project/modulab-core:${{ github.event.release.tag_name }} \
            $(printf 'ghcr.io/modulab-project/modulab-core@sha256:%s ' *)
      # Mirrors the multi-arch manifest just created above to Docker Hub.
      # Deliberately NOT a second push-by-digest leg in publish-image-build:
      # docker/build-push-action's outputs field only supports one image
      # name per push-by-digest build (a comma-separated name= list there
      # needs the whole field single-quoted, which GitHub Actions' own YAML
      # quoting can't express without breaking the parser - confirmed via
      # docker/build-push-action#1067, where exactly this was attempted and
      # only the last name in the list ever got pushed). `imagetools create`
      # sidesteps that: given one existing multi-platform source, it does a
      # "carbon copy" to a new destination/tag, copying whatever blobs the
      # destination registry doesn't already have - so this reuses the
      # ghcr.io manifest just created above instead of building or pushing
      # anything a second time.
      - name: Copy image to Docker Hub
        run: |
          docker buildx imagetools create \
            -t docker.io/getmodulab/modulab-core:latest \
            -t docker.io/getmodulab/modulab-core:${{ github.event.release.tag_name }} \
            ghcr.io/modulab-project/modulab-core:${{ github.event.release.tag_name }}
      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/modulab-project/modulab-core:${{ github.event.release.tag_name }}
      # Scans the image that was just published (OS packages + Deno/Go/npm
      # dependencies baked into it), not just the source dependency lists -
      # catches base-image CVEs (debian:bookworm-slim, node:24-alpine,
      # golang:1.26-alpine) that govulncheck/npm audit above can't see since
      # those only look at this repo's own go.mod/package.json.
      # continue-on-error: true is deliberate here (unlike govulncheck/npm
      # audit, which block backend/frontend outright) - a released image
      # already got pushed by the step above by the time this runs, and a
      # base-image CVE with no upstream fix yet shouldn't be able to turn
      # every release red with nothing actionable to do about it. Findings
      # still show up in the job log either way.
      # Pinned to a release tag instead of @master: an unpinned branch ref
      # means the action's behavior (and its supply-chain trust boundary)
      # can change under us on any push to trivy-action's main branch.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/modulab-project/modulab-core:${{ github.event.release.tag_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      # Generates a CycloneDX SBOM of the exact image just published (OS
      # packages + Go/npm/Deno/cosign versions baked in), reusing the same
      # Trivy scanner as the vulnerability scan above rather than a second
      # tool. Attached to the GitHub Release so anyone consuming this image
      # - or checking it against a newly disclosed CVE later - can see
      # what's actually in it without re-scanning it themselves.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/modulab-project/modulab-core:${{ github.event.release.tag_name }}
          format: cyclonedx
          output: sbom.cdx.json
      # --repo is required here: this job never checks out the source (it
      # only needs the digest artifacts), so there's no .git directory for
      # gh to infer the repo from - without it, `gh release upload` fails
      # with "fatal: not a git repository".
      - name: Attach SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber --repo "${{ github.repository }}"
      # Builds the Docker Hub Full Description from this exact release's
      # title and notes so the repo page always reflects the version that
      # was just published, instead of a static README that drifts. The
      # release title/body go through env vars rather than directly into
      # the run: script - interpolating untrusted GitHub context straight
      # into a shell command is a known script-injection vector (a release
      # body containing e.g. `$(...)` or backticks would otherwise execute
      # in this step); env vars are substituted after the shell parses the
      # script, so their contents are inert.
      - name: Build Docker Hub description
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          {
            echo "# ${RELEASE_NAME}"
            echo
            echo "${RELEASE_BODY}"
          } > /tmp/dockerhub-readme.md
      # peter-evans/dockerhub-description pushes short-description (repo
      # tagline, Docker Hub's 100-char field) and the Full Description
      # (readme-filepath, Docker Hub's long-form repo page body) together.
      # SHA-pinned to match this file's convention elsewhere - confirmed via
      # `git ls-remote --tags` that v5.0.0 is a lightweight tag pointing
      # directly at this commit (no separate tag object to dereference).
      - name: Update Docker Hub description
