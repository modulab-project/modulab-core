name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Publishing a GitHub Release is the point this project's own release
  # process (bump the manifest version, commit, then create the release/tag
  # by hand - see README/project docs) already treats as "this version is
  # official". The publish-image job below hooks into exactly that moment
  # rather than adding a new step to the process: nothing here runs
  # automatically on every push to main, only when a release is published.
  release:
    types: [published]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Reads the exact version straight from go.mod's own "go" line
          # instead of a hardcoded value here - single source of truth, no
          # second place to remember to bump. This replaces an earlier
          # hardcoded "1.26" that silently resolved to a stale cached
          # go1.26.4 even after go.mod required >= 1.26.5 (GOTOOLCHAIN=local
          # blocks auto-fetching a newer toolchain to cover a gap like that).
          # go-version-file + check-latest below closes both problems: it
          # always matches go.mod, and it always fetches rather than
          # settling for whatever happens to be cached on the runner.
          go-version-file: backend/go.mod
          check-latest: true
      # v6 + no explicit version installs golangci-lint v1.64.8, which was
      # itself built with go1.24 - it refuses to lint code targeting a newer
      # Go version than it was built with ("the Go language version (go1.24)
      # used to build golangci-lint is lower than the targeted Go version").
      # v9 + pinning a v2.x release (built with newer Go) is what actually
      # supports the go-version above.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: backend
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      # Catches known-vulnerable dependencies actually reachable from this
      # codebase's own call graph (govulncheck only flags a CVE if code here
      # calls into the vulnerable function - not just "this dep is in
      # go.sum somewhere"). Added after this exact gap let two real,
      # reachable CVEs sit in go.mod during the V1 hardening pass
      # (GO-2026-5004 in jackc/pgx, GO-2025-3540 in redis/go-redis) until a
      # manual local run happened to catch them.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      # eslint.config.js (flat config, ESLint 10) added during the pre-V1
      # review pass: js.configs.recommended + typescript-eslint recommended
      # + eslint-plugin-react-hooks + eslint-plugin-jsx-a11y. This blocks
      # the build on real findings now (e.g. it would have caught the
      # alt="" accessibility gaps and a missing useEffect cleanup found by
      # hand during that review) instead of relying on manual audit passes.
      - name: Lint
        run: npm run lint
      - name: Test (not implemented - see step comment)
        continue-on-error: true
        run: |
          echo "::warning::Frontend unit tests are not implemented yet (no test runner or test files in frontend/). This step intentionally fails so CI does not show a false green check."
          exit 1
      - run: npm run build
      - name: a11y checks (axe-core) (not implemented - see step comment)
        continue-on-error: true
        run: |
          echo "::warning::a11y checks are not implemented yet (no axe-core setup in frontend/). This step intentionally fails so CI does not show a false green check."
          exit 1
      # --audit-level=high: dev-dependency low/moderate advisories are noisy
      # and common (build tooling, not shipped to users); high/critical in
      # anything actually bundled is worth failing CI over.
      - name: npm audit
        run: npm audit --audit-level=high

  # Deliberately not implemented yet - see the decision below before adding
  # real Playwright coverage here.
  #
  # `echo "TODO: ..."` always exits 0, so this job used to show a plain green
  # check next to backend/frontend - indistinguishable from "tests passed" to
  # anyone glancing at CI status, even though zero tests actually ran.
  # continue-on-error below keeps that (a step that fails on purpose still
  # lets the job - and any check depending on it - complete), but GitHub now
  # renders it with a "failed but continued" warning icon instead of a plain
  # check, so the gap is visible rather than silently hidden.
  #
  # Why there's still no real test here: every route in this app sits behind
  # OIDC login (spec section 3.3) - there is no local username/password path
  # to script around. A real E2E smoke test therefore needs an OIDC provider
  # to log in against, and running one in CI means standing up a lightweight
  # mock IdP (e.g. Dex or mock-oauth2-server) alongside Playwright and the
  # Postgres/Valkey testcontainers already needed - a genuinely new piece of
  # test infrastructure, not just a test file. For a solo homelab project
  # without external CI/CD pressure, that setup and its ongoing upkeep isn't
  # worth it yet - revisit once there are outside contributors, or once a
  # login/setup-wizard regression actually slips through undetected more than
  # once (see the news-feed encryption bug this same testing gap let through
  # during the V1 hardening pass).
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Playwright smoke tests (not implemented - see job comment)
        continue-on-error: true
        run: |
          echo "::warning::E2E smoke tests are not implemented yet (Setup Wizard, login flow, module installation - spec section 13.3). This step intentionally fails so CI does not show a false green check."
          exit 1

  # Runs only when a GitHub Release is published (see the `on: release`
  # trigger above) - never on a plain push to main. Builds this repo's own
  # root Dockerfile (the same multi-stage build reset-and-test.sh runs
  # locally) and pushes it to ghcr.io tagged with the release's tag name
  # (e.g. "v0.2.0") and "latest", so docker-compose.yml's
  # ghcr.io/modulab-project/modulab-core:latest reference resolves to a real,
  # pullable image for anyone who is not building locally themselves.
  # GITHUB_TOKEN is sufficient to push to this repo's own ghcr.io package -
  # no extra secret needed - but the job needs "packages: write" explicitly
  # since the default token permissions are read-only.
  publish-image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'release'
    permissions:
      # write (not read) because the SBOM step below attaches a file to
      # this same GitHub Release via `gh release upload` - packages: write
      # alone only covers the ghcr.io push.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      # QEMU lets the amd64 runner emulate arm64 to build that platform's
      # layers (the Dockerfile's go-builder/frontend-builder stages have no
      # native cross-compile args, so arm64 layers are built under emulation -
      # slower than a native arm64 runner, but fine for a solo project's
      # release cadence). Buildx is the BuildKit driver that actually knows
      # how to produce a multi-platform manifest list from a single build
      # invocation; the default docker driver can't.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/modulab-project/modulab-core:latest
            ghcr.io/modulab-project/modulab-core:${{ github.event.release.tag_name }}
      # Scans the image that was just published (OS packages + Deno/Go/npm
      # dependencies baked into it), not just the source dependency lists -
      # catches base-image CVEs (debian:bookworm-slim, node:24-alpine,
      # golang:1.26-alpine) that govulncheck/npm audit above can't see since
      # those only look at this repo's own go.mod/package.json.
      # continue-on-error: true is deliberate here (unlike govulncheck/npm
      # audit, which block backend/frontend outright) - a released image
      # already got pushed by the step above by the time this runs, and a
      # base-image CVE with no upstream fix yet shouldn't be able to turn
      # every release red with nothing actionable to do about it. Findings
      # still show up in the job log either way.
      # Pinned to a release tag instead of @master: an unpinned branch ref
      # means the action's behavior (and its supply-chain trust boundary)
      # can change under us on any push to trivy-action's main branch.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/modulab-project/modulab-core:${{ github.event.release.tag_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      # Generates a CycloneDX SBOM of the exact image just published (OS
      # packages + Go/npm/Deno/cosign versions baked in), reusing the same
      # Trivy scanner as the vulnerability scan above rather than a second
      # tool. Attached to the GitHub Release so anyone consuming this image
      # - or checking it against a newly disclosed CVE later - can see
      # what's actually in it without re-scanning it themselves.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/modulab-project/modulab-core:${{ github.event.release.tag_name }}
          format: cyclonedx
          output: sbom.cdx.json
      - name: Attach SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber

  # deploy/Dockerfile.nginx copies its static frontend files out of the core
  # image (COPY --from=core-source, ARG CORE_IMAGE) rather than building the
  # frontend itself - see that file's doc comment. That only produces a
  # correct result if it's built with CORE_IMAGE pointing at the *exact*
  # core image publish-image just pushed, which is why this job `needs:
  # publish-image` instead of running in parallel with it: without that
  # ordering, this could build against whatever ghcr.io/.../modulab-core:latest
  # happened to resolve to at the time (a stale previous release, on a
  # runner that has no local Docker cache of its own to fall back on
  # incorrectly either way - it would just as happily build a broken image
  # against the wrong source).
  #
  # This is also what keeps a release "docker compose pull && docker compose
  # up -d" on the deployment host - see docker-compose.yml's nginx service,
  # now `image:` instead of `build:`. Before this job existed, nginx was
  # built locally on the host from deploy/Dockerfile.nginx, which had the
  # same stale-source risk this job's `needs:` ordering exists to avoid, but
  # with no equivalent safeguard - a plain `docker compose pull` doesn't
  # touch build-only services at all, and `docker compose up -d` without
  # `--build` reuses whatever nginx image already happened to be sitting on
  # the host, however old. That gap is exactly what made Core and Frontend
  # disagree on their own version number after the 1.0.1 release (2026-07-08).
  publish-nginx-image:
    runs-on: ubuntu-latest
    needs: [publish-image]
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Same reasoning as publish-image above: this build's own base
      # (nginx:alpine) and its COPY --from=core-source stage both need to
      # resolve per-platform, which only buildx (with QEMU registered for the
      # non-native arch) can do in one invocation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./deploy
          file: ./deploy/Dockerfile.nginx
          platforms: linux/amd64,linux/arm64
          build-args: |
            CORE_IMAGE=ghcr.io/modulab-project/modulab-core:${{ github.event.release.tag_name }}
          push: true
          tags: |
            ghcr.io/modulab-project/modulab-core-nginx:latest
            ghcr.io/modulab-project/modulab-core-nginx:${{ github.event.release.tag_name }}
