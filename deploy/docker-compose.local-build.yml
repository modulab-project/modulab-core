# Local full-stack test override for nginx.
#
# Deliberately NOT named docker-compose.override.yml: that filename is
# auto-merged by Compose whenever it sits next to docker-compose.yml in the
# same directory, with no `-f` needed. This directory *is* what the
# production/homelab host also runs `docker compose` from (see README's
# deploy/docker-compose.yml description) - after a `git pull` picks up this
# file, an auto-loaded override would silently turn a plain `docker compose
# pull && docker compose up -d` release upgrade into a local nginx rebuild
# from source instead of using the CI-published, correctly versioned image,
# bringing back the exact "Core and Frontend disagree on their own version
# number" bug from the 1.0.1 release that publish-nginx-image (ci.yml) was
# built to prevent. Must be included explicitly - same convention as
# docker-compose.dev.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.local-build.yml build --no-cache nginx
#   docker compose -f docker-compose.yml -f docker-compose.local-build.yml up -d
#
# reset-and-test.sh (a separate clone at ~/ModuLab/modulab-core-docker,
# populated via `git clone`/`git pull`, not this working tree) needs both
# `-f` flags added to its compose invocations to pick this up.
#
# Adds a `build:` section to `nginx`, which the base docker-compose.yml
# doesn't have (it only has `image:`). Without this, reset-and-test.sh's
# `docker compose build --no-cache nginx` step in update_build has nothing
# to build, so `docker compose up -d` afterwards keeps running whatever
# nginx image (published or previously cached) it already has — the fresh
# frontend baked into the just-rebuilt core image never makes it in.
#
# No CORE_IMAGE build arg is set here on purpose: Dockerfile.nginx's own
# default (ARG CORE_IMAGE=ghcr.io/modulab-project/modulab-core:latest)
# already matches $IMAGE in reset-and-test.sh, which is the exact tag the
# script just built and tagged locally via `docker build -t "$IMAGE"
# "$CLONE_DIR"` a few lines earlier — so nginx's build picks that up
# straight from the local image store, no registry involved.
#
# Covers both script modes:
#   - update_build: explicit `docker compose build --no-cache nginx` now
#     has something to build.
#   - new_build: `docker compose up -d` builds nginx automatically the
#     first time, since no matching image tag exists yet in a fresh
#     environment and a build: section is present.

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
