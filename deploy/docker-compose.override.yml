# Local full-stack test override — auto-loaded by Compose alongside
# docker-compose.yml (same directory), and picked up by reset-and-test.sh
# once committed/pushed (that script works against a separate clone at
# ~/ModuLab/modulab-core-docker, populated via `git clone`/`git pull`, not
# this working tree).
#
# Adds a `build:` section to `nginx`, which the base docker-compose.yml
# doesn't have (it only has `image:`). Without this, reset-and-test.sh's
# `docker compose build --no-cache nginx` step in update_build has nothing
# to build, so `docker compose up -d` afterwards keeps running whatever
# nginx image (published or previously cached) it already has — the fresh
# frontend baked into the just-rebuilt core image never makes it in.
#
# No CORE_IMAGE build arg is set here on purpose: Dockerfile.nginx's own
# default (ARG CORE_IMAGE=ghcr.io/modulab-project/modulab-core:latest)
# already matches $IMAGE in reset-and-test.sh, which is the exact tag the
# script just built and tagged locally via `docker build -t "$IMAGE"
# "$CLONE_DIR"` a few lines earlier — so nginx's build picks that up
# straight from the local image store, no registry involved.
#
# Covers both script modes:
#   - update_build: explicit `docker compose build --no-cache nginx` now
#     has something to build.
#   - new_build: `docker compose up -d` builds nginx automatically the
#     first time, since no matching image tag exists yet in a fresh
#     environment and a build: section is present.

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
