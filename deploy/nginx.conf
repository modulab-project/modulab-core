server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's built-in default is 1m, which silently cuts off any module
    # file upload over ~1 MiB (e.g. my-place/recipes photo uploads, proxied
    # through /v1/ below) before the request ever reaches Core - the client
    # just sees a bare 502 with no useful body. Core itself allows up to
    # 20 MB per upload (maxUploadBytes in router.go); match that here with
    # headroom so this proxy layer isn't the tightest limit in the chain.
    # Found 2026-07-07 chasing intermittent 502s on my-place's photo upload
    # that turned out to reproduce consistently above ~1024 KB.
    client_max_body_size 25m;

    # Gzip the SPA's own JS/CSS bundle and any JSON API response proxied
    # through this server block - both compress well and were previously
    # served uncompressed. gzip_min_length skips the overhead of compressing
    # already-small responses (e.g. tiny JSON replies) where the gzip framing
    # itself would eat most of the saving. gzip_proxied any applies this to
    # the /v1/ proxy_pass responses too, not just static files served
    # directly from root.
    gzip on;
    gzip_types application/json text/javascript text/css;
    gzip_min_length 1024;
    gzip_proxied any;

    # Security headers for the SPA response itself. Applied to every
    # response from this server block (add_header is inherited by location
    # blocks unless they set their own add_header, which none below do).
    #
    # CSP note on "script-src 'self' blob:": ModulePage.tsx currently loads
    # each installed module's UI bundle via fetch() + a Blob URL + dynamic
    # import() (dynamic import() can't send an Authorization header, so the
    # bundle is fetched with one and re-wrapped as a blob: URL — see
    # ModulePage.tsx's fetchModuleBundle). That means blob: script execution
    # is unavoidable with the current loading mechanism, even though a
    # compromised module bundle then runs with full DOM/sessionStorage
    # access in the top-level frame — see the Core security review (2026-07)
    # under "Modul-Rendering ohne Sandbox". The planned fix is moving module
    # rendering into a sandboxed <iframe> with postMessage RPC, at which
    # point blob: can be dropped from this CSP entirely, since the iframe
    # would load the bundle same-origin instead. Until then this CSP is
    # necessary-but-not-sufficient: it stops classic injected <script src>
    # payloads from arbitrary origins, but does not stop a malicious module
    # bundle itself, which is exactly what it's allowlisted to run.
    #
    # CSP note on style-src/font-src: previously carried a
    # cdnjs.cloudflare.com exception here for the Tabler Icons webfont CSS -
    # removed (2026-07-22) now that @tabler/icons-webfont is a self-hosted
    # frontend dependency (imported in src/main.tsx) instead of a
    # cdnjs.cloudflare.com <link> in index.html. Closes both this CSP
    # exception and the missing-SRI finding from the earlier frontend
    # review in one move - a same-origin resource needs neither. If a
    # future change reintroduces a third-party font/style CDN, re-add the
    # matching exception here rather than loosening this to a blanket
    # allowance.
    #
    # style-src split into style-src-elem/style-src-attr (2026-07-23
    # security pass), replacing a blanket "style-src 'self' 'unsafe-inline'"
    # that allowed both injected <style> blocks AND inline style="..."
    # attributes. The actual CSS-exfiltration/UI-redressing risk needs
    # attacker-controlled CSS *selectors* (attribute selectors, sibling
    # combinators, background:url(...) on an injected rule) - that requires
    # a full <style> element or <link>, which style-src-elem 'self' now
    # blocks same as script-src blocks injected <script>. Plain inline
    # style="..." attributes (React's style={{...}} prop, e.g. AppShell.tsx's
    # chat maxHeight, Home.tsx's precip-probability bar width) only ever set
    # a fixed property to a value already chosen by the app - an attacker
    # who can inject one of those has no attacker-controlled selector to
    # exploit, so style-src-attr keeps 'unsafe-inline' for that narrower,
    # lower-severity surface rather than rewriting every dynamic-width bar
    # into a nonce-based scheme. If a future component needs a real
    # attacker-influenced style *value* (not just app data), treat that as
    # its own review, not something this CSP should quietly allow.
    #
    # CSP note on "connect-src ... api.maptiler.com": the my-place module's
    # MapView (ui/src/App.tsx) loads a MapLibre GL style.json and tile data
    # directly from api.maptiler.com in the BROWSER — this is not a Deno
    # worker egress concern (the module's own --allow-net grant, see
    # backend/internal/modules/deno.go, is irrelevant here since the fetch
    # never goes through Core or the worker at all). Without this,
    # connect-src 'self' blocked every map style/tile request outright and
    # the map area rendered completely blank with no visible error unless
    # the browser console was checked — found 2026-07-03, missed when this
    # CSP was first introduced because the map wasn't tested at the time.
    # img-src already had a blanket https: allowance (for user-uploaded spot
    # photos potentially hosted elsewhere), which happens to cover MapLibre's
    # raster tile <img>-style requests too, but vector tile/style JSON fetches
    # go through connect-src, not img-src.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # report-uri/report-to: this CSP has silently dropped violations since it
    # was first introduced - a real XSS attempt would leave no trace anywhere
    # an operator would think to look. Both point at Core's
    # POST /v1/csp-report (backend/cmd/core/main.go's cspReportHandler,
    # proxied through the /v1/ location block below like any other API
    # call) - report-uri is the still-universally-supported legacy
    # directive, report-to is the modern replacement Chrome now prefers,
    # which needs the separate Reporting-Endpoints header to name what
    # "csp-endpoint" points at. Sending both costs nothing (a browser that
    # understands report-to ignores report-uri) and covers every browser.
    add_header Reporting-Endpoints "csp-endpoint=\"/v1/csp-report\"" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' api.maptiler.com; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; report-uri /v1/csp-report; report-to csp-endpoint" always;

    # Permissions-Policy: mirrors backend/cmd/core/main.go's secHeadersMiddleware
    # (kept in sync deliberately - see that comment for the full reasoning).
    # geolocation is needed for my-place's MapLibre view; clipboard-write for
    # copy buttons; fullscreen for the map view's fullscreen control. Every
    # other powerful feature is denied outright - nothing in ModuLab or any
    # current module needs camera/microphone/payment/usb/midi/sensors.
    add_header Permissions-Policy "geolocation=(self), clipboard-write=(self), fullscreen=(self), camera=(), microphone=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Health check — must be proxied to Core, not served as SPA
    location /healthz {
        proxy_pass http://core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API and WebSocket requests to Core
    location /v1/ {
        proxy_pass http://core:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    # GET /v1/events (auth/events.go's SSE stream) needs its own block: the
    # /v1/ block above proxies fine functionally, but nginx's default
    # response buffering (proxy_buffering on, 4-8KB proxy_buffers) holds
    # each small "data: {...}\n\n" chunk — and the periodic heartbeat
    # comment lines — until enough bytes accumulate or the connection
    # closes, instead of forwarding them to the browser as Core writes and
    # flushes them. The backend handler itself is already correctly
    # real-time (http.Flusher.Flush() after every write, see
    # auth/events.go) — this was purely a proxy-layer buffering gap, found
    # 2026-07-04 while chasing reports that the notification bell badge and
    # feed sometimes needed a manual reload to appear. Must precede the
    # general /v1/ block so nginx's longest-prefix-match picks this one for
    # exactly this path.
    location = /v1/events {
        proxy_pass http://core:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering "no" always;

        # The security headers from the server block have to be repeated
        # here, and this is the one place in this file where that is true:
        # nginx's add_header directives are inherited from the enclosing
        # level ONLY as long as the inner level declares none of its own.
        # X-Accel-Buffering above (which this block exists for) is an
        # add_header, so declaring it silently dropped every server-level
        # header for this one route - the SSE stream was going out with no
        # CSP, no nosniff, no frame-ancestors, no Permissions-Policy at all
        # (found in the 2026-07-27 security review; the response body is
        # JSON events rather than a document, so nothing visibly broke).
        #
        # Keep in sync with the server-level block above. If a third
        # location ever needs its own add_header, it needs this list too -
        # nginx offers no "inherit and add" form.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Reporting-Endpoints "csp-endpoint=\"/v1/csp-report\"" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' api.maptiler.com; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; report-uri /v1/csp-report; report-to csp-endpoint" always;
        add_header Permissions-Policy "geolocation=(self), clipboard-write=(self), fullscreen=(self), camera=(), microphone=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    }

    # Hashed build output (Vite's assets/<name>-<hash>.js|css). The hash in
    # the filename guarantees a new build never overwrites/reuses an old
    # asset's URL, so these are safe to cache "forever" - a stale cached
    # copy simply keeps pointing at content that still matches its own
    # hash. Fixes the "have to clear the browser cache after every release"
    # problem: previously this server block sent no Cache-Control at all,
    # so browsers (and Cloudflare's edge, which proxies this domain) fell
    # back to heuristic caching of both the assets AND index.html, and a
    # stale cached index.html kept referencing asset hashes that may no
    # longer exist post-deploy. Found/fixed 2026-08-03.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # add_header is only inherited from the server block if this
        # location declares none of its own (see the /v1/events block
        # above for the same nginx quirk) - repeat the security headers
        # here or this route silently ships with no CSP/nosniff/etc.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Reporting-Endpoints "csp-endpoint=\"/v1/csp-report\"" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' api.maptiler.com; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; report-uri /v1/csp-report; report-to csp-endpoint" always;
        add_header Permissions-Policy "geolocation=(self), clipboard-write=(self), fullscreen=(self), camera=(), microphone=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    }

    # PWA files (vite-plugin-pwa, see frontend/vite.config.ts) that name the
    # currently-installed build: the service worker script and the web app
    # manifest. Neither has a hash in its URL, so they need the opposite
    # policy from /assets/ above - always revalidate, never let a cached
    # copy survive a deploy, otherwise the SW's "autoUpdate" registration
    # never notices a new build shipped.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Reporting-Endpoints "csp-endpoint=\"/v1/csp-report\"" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' api.maptiler.com; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; report-uri /v1/csp-report; report-to csp-endpoint" always;
        add_header Permissions-Policy "geolocation=(self), clipboard-write=(self), fullscreen=(self), camera=(), microphone=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    }

    # SPA fallback — all other paths serve index.html. Same no-cache
    # reasoning as the PWA files above: index.html references the current
    # build's hashed asset filenames, so a stale cached copy of it is what
    # used to make people manually clear their browser cache to see a new
    # release. This is a real HTTP header (unlike the old <meta
    # http-equiv="Cache-Control"> tags in index.html, which browsers ignore
    # for actual caching decisions and Cloudflare's edge never sees at
    # all) - removed those tags accordingly.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Reporting-Endpoints "csp-endpoint=\"/v1/csp-report\"" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' api.maptiler.com; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; report-uri /v1/csp-report; report-to csp-endpoint" always;
        add_header Permissions-Policy "geolocation=(self), clipboard-write=(self), fullscreen=(self), camera=(), microphone=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        try_files $uri $uri/ /index.html;
    }
}
