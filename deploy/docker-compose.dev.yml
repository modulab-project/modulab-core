# Local development stack, only the stateful dependencies.
# Core (Go) and the frontend (Vite) run on the host for fast iteration;
# see ../README.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modulab
      POSTGRES_USER: modulab
      POSTGRES_PASSWORD: modulab-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-dev-data:
