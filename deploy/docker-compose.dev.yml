# Local development stack, only the stateful dependencies.
# Core (Go) and the frontend (Vite) run on the host for fast iteration;
# see ../README.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modulab
      POSTGRES_USER: modulab
      POSTGRES_PASSWORD: modulab-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_REDIS_URL=redis://valkey:6379/1
    volumes:
      - ./searxng:/etc/searxng

volumes:
  postgres-dev-data:
