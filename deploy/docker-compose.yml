# Production stack (spec section 2.1, Zero-Expose-Policy).
# Only Traefik is exposed externally; everything else is on an internal
# Docker bridge network.

services:
  traefik:
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.dnschallenge=true"
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - modulab-internal

  core:
    image: ghcr.io/modulab-project/modulab-core:latest
    env_file: ../.env
    depends_on:
      - pgbouncer
      - valkey
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.rule=Host(`modulab.example.com`)"
      - "traefik.http.routers.core.tls.certresolver=le"
    networks:
      - modulab-internal

  postgres:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - modulab-internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    env_file: ../.env
    depends_on:
      - postgres
    networks:
      - modulab-internal

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey-data:/data
    networks:
      - modulab-internal

networks:
  modulab-internal:
    internal: true

volumes:
  postgres-data:
  valkey-data:
  traefik-acme:
