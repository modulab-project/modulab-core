# Production stack (spec section 2.1, Zero-Expose-Policy).
# Only Traefik is exposed externally; everything else is on an internal
# Docker bridge network.

services:
  traefik:
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.dnschallenge=true"
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - modulab-internal

  core:
    image: ghcr.io/modulab-project/modulab-core:latest
    env_file: ../.env
    environment:
      - MODULAB_MODULE_DATA_DIR=/var/lib/modulab/modules
    volumes:
      - modulab-modules-data:/var/lib/modulab/modules
    depends_on:
      - pgbouncer
      - valkey
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.rule=Host(`modulab.example.com`)"
      - "traefik.http.routers.core.tls.certresolver=le"
    networks:
      - modulab-internal

  postgres:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - modulab-internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    env_file: ../.env
    depends_on:
      - postgres
    networks:
      - modulab-internal

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey-data:/data
    networks:
      - modulab-internal

  # SearXNG is optional - only started when the "search" profile is active.
  # To enable: docker compose --profile search up -d
  # Operators who already run their own SearXNG instance can skip this and
  # just enter the external URL in Admin → SearXNG.
  #
  # SearXNG uses Valkey (Redis-compatible) for its internal rate-limiting
  # cache. We reuse ModuLab's own Valkey instance to avoid adding a second
  # in-memory store - SearXNG's keys are namespaced by SearXNG itself so
  # there is no collision risk.
  searxng:
    profiles: ["search"]
    image: searxng/searxng:latest
    environment:
      - SEARXNG_BASE_URL=https://${MODULAB_DOMAIN:-modulab.example.com}/searxng/
      - SEARXNG_REDIS_URL=redis://valkey:6379/1
    volumes:
      - searxng-data:/etc/searxng
    depends_on:
      - valkey
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`${MODULAB_DOMAIN:-modulab.example.com}`) && PathPrefix(`/searxng`)"
      - "traefik.http.routers.searxng.tls.certresolver=le"
      - "traefik.http.middlewares.searxng-strip.stripprefix.prefixes=/searxng"
      - "traefik.http.routers.searxng.middlewares=searxng-strip"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    networks:
      - modulab-internal

networks:
  modulab-internal:
    internal: true

volumes:
  postgres-data:
  valkey-data:
  traefik-acme:
  searxng-data:
  modulab-modules-data:
