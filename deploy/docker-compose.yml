# ModuLab Core — self-hosted Docker stack
#
# Usage:
#   cd deploy/
#   cp .env.example .env   # fill in all required values
#   docker compose up -d
#   docker compose logs -f core
#
# Upgrading to a new release: the core image is published by the CI release
# pipeline (.github/workflows/ci.yml's publish-image job) when a GitHub
# Release is published - there is no local build step involved, so upgrading
# is always just:
#   docker compose pull
#   docker compose up -d
#
# Resource limits: every service below sets mem_limit/cpus. These are
# non-swarm Compose fields (no `deploy:` key or swarm mode needed) and exist
# so a single runaway container (e.g. a misbehaving module's Deno subprocess
# under core, or Postgres under an unexpectedly large query) cannot exhaust
# the whole host and take every other service down with it - there was
# previously no ceiling on any service at all. Sizes below are starting
# points for a typical homelab box, not hard requirements; raise them if a
# service is actually being throttled (`docker stats` will show it sitting
# at its cpus/mem_limit ceiling).

services:

  # ── Docker socket proxy ──────────────────────────────────────────────────────
  # Sits between Traefik and the real Docker socket. A bare `:ro` bind mount
  # of docker.sock (the previous setup) only restricts the file open mode -
  # it is not an API-level permission boundary, since the Docker daemon's
  # Unix-socket protocol is bidirectional regardless of how the socket file
  # itself was mounted. A container with any access to the raw socket can
  # still reach write/exec endpoints depending on how the client library
  # opens the connection, which amounts to root-on-the-host if Traefik is
  # ever compromised (a real risk: it's the one container directly exposed
  # to the internet). This proxy terminates the real socket and only forwards
  # the handful of read-only, GET-based endpoints Traefik's Docker provider
  # actually needs (listing containers + their labels, and the events
  # stream so it notices new containers) - everything else (POST, exec,
  # volumes, networks, swarm, etc.) is denied by default. Runs on its own
  # network that nothing else in this stack can reach.
  docker-socket-proxy:
    # Pinned to a version tag rather than "latest" (2026-08-02 ops pass) -
    # same mutable-tag risk as the other images in this file.
    # TODO: pin to a specific digest like the other images below once verified (see commented images for the pattern)
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    environment:
      # Read-only, GET-only endpoints Traefik's Docker provider needs:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      # Explicit belt-and-suspenders: everything else this image can gate is
      # off by default, but naming the sensitive ones here documents intent
      # (POST/exec/networks/volumes/swarm all denied).
      POST: 0
      EXEC: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-socket-proxy-internal
    healthcheck:
      # Alpine-based image, so plain busybox wget is available without
      # installing anything extra. Hits the proxy's own forwarded /version
      # endpoint (allowed above via VERSION: 1) to confirm it is actually
      # accepting requests, not just that the process has started - so
      # Traefik's depends_on below can wait for "ready", not just "running".
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2375/version"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Traefik (edge proxy + TLS) ───────────────────────────────────────────────
  traefik:
    # Digest-pinned (2026-07-23 security pass): a tag like v3 is a mutable
    # pointer, so `docker compose pull` weeks later could silently swap in a
    # different image. Bump this deliberately, not implicitly on every pull.
    image: traefik:v3@sha256:4299bbed850421258fc5448c2e0e6ad350981d4d335a68de11b92448aedbefe5
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      # Per-request HTTP access log, off by default in Traefik. Until now
      # the only access log in the whole stack was nginx's own (the
      # official image writes it to stdout, so `docker compose logs nginx`
      # happened to double as the request log) - Core has no
      # request-logging middleware of its own, so without this there would
      # be no record of who requested what anywhere. Enabled here rather
      # than added to Core because Traefik is the component that actually
      # terminates TLS and sees the untrusted client: it logs the real
      # remote address, the entrypoint and the router that matched, none of
      # which Core can reconstruct from the proxied request alone.
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=modulab-internal"
      # Talk to the socket proxy above instead of mounting the real
      # docker.sock into this container directly - see that service's doc
      # comment for why.
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      # HTTPS entrypoint
      - "--entrypoints.websecure.address=:443"
      # Redirect plain HTTP → HTTPS
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt via Cloudflare DNS-Challenge.
      # External resolvers bypass Docker's internal DNS which cannot resolve
      # public ACME challenge records (_acme-challenge.<domain>).
      - "--certificatesresolvers.le.acme.dnschallenge=true"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Cloudflare API token — needs Zone:DNS:Edit permission for your domain.
      # Must be exactly 40 characters with no surrounding whitespace.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - traefik-acme:/letsencrypt
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - modulab-internal
      - docker-socket-proxy-internal

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    # Digest-pinned - same reasoning as the traefik service above.
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - modulab-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Valkey (Core only) ───────────────────────────────────────────────────────
  # Password-protected since 2026-07-28. What lives in here is not "cache
  # data" - it is every live session - but as of 2026-08 it no longer holds
  # a replayable credential anywhere. Session keys are named
  # session:<sha256(bearer token)> and moduletoken: entries reference the
  # underlying session by that same digest, so read access here (a SCAN, or
  # an RDB/AOF snapshot off the valkey-data volume below) yields hashes, not
  # tokens: it still exposes who is logged in from where, but no longer lets
  # the reader impersonate them. See sessionKeyPrefix in
  # backend/internal/auth/session.go for the full reasoning.
  #
  # The password stays regardless - the values are still session metadata
  # under AES-GCM plus a keyspace anyone with access could disrupt by
  # deletion. The instance has never had a published port and is only
  # reachable over modulab-internal, but Postgres on that same network has
  # always had a password while this did not.
  #
  # SearXNG deliberately does NOT share this instance anymore (it used to,
  # via SEARXNG_REDIS_URL=redis://valkey:6379/1) - see searxng-valkey below.
  valkey:
    # Digest-pinned - same reasoning as the traefik service above.
    image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    restart: unless-stopped
    # --requirepass on the command line rather than a mounted valkey.conf:
    # one less bind mount for a single directive. VALKEY_PASSWORD is
    # substituted by Compose from .env at parse time.
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in .env}"]
    environment:
      # Same value again as a container env var, purely so the healthcheck
      # below can authenticate - the command line above is already resolved
      # by then and cannot be read back from inside the container.
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - valkey-data:/data
    networks:
      - modulab-internal
    healthcheck:
      # MUST authenticate. A bare `valkey-cli ping` answers
      # "NOAUTH Authentication required" and exits non-zero once
      # --requirepass is set, so the container would never become healthy -
      # and core's depends_on: condition: service_healthy means Core would
      # then never start at all, with an error that looks nothing like a
      # password problem. $$ escapes the $ so Compose leaves it for the
      # shell inside the container; --no-auth-warning suppresses valkey-cli's
      # "using a password on the command line" notice on stderr.
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Valkey (SearXNG only) ────────────────────────────────────────────────────
  # SearXNG used to share Core's Valkey (DB 1). Split out 2026-07-28: it
  # needs Redis only for its own rate limiting and result caching, none of
  # which is sensitive, while sharing the instance meant a third-party
  # application we do not maintain sat one connection away from every
  # ModuLab session token.
  #
  # Note what a shared password would NOT have fixed: SearXNG needs the
  # credential to do its job, so it would hold it, and a compromise of
  # SearXNG would still hand over Core's sessions. Separating the instances
  # is what actually removes the reach - this container has no route to
  # Core's Valkey and does not know its password.
  #
  # No password here on purpose: nothing of value is stored, and the only
  # client is SearXNG itself. No volume either - a cold cache after a
  # restart costs one slower search, and persisting it would only mean
  # keeping other people's search queries on disk for no benefit.
  searxng-valkey:
    image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    networks:
      - modulab-internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ModuLab Core ─────────────────────────────────────────────────────────────
  core:
    image: ghcr.io/modulab-project/modulab-core:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MODULAB_MODULE_DATA_DIR: /var/lib/modulab/modules
      MODULAB_PUBLIC_BASE_URL: https://${MODULAB_DOMAIN}
      MODULAB_FRONTEND_BASE_URL: https://${MODULAB_DOMAIN}
      MODULAB_DB_HOST: postgres
      MODULAB_DB_PORT: "5432"
      MODULAB_DB_NAME: ${POSTGRES_DB}
      MODULAB_DB_USER: ${POSTGRES_USER}
      MODULAB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      MODULAB_VALKEY_HOST: valkey
      MODULAB_VALKEY_PORT: "6379"
      # Read by config.Load into Config.ValkeyPassword and passed straight
      # through to redis.Options.Password (internal/valkey/client.go) - the
      # client side has supported this all along, only the deployment never
      # set it.
      MODULAB_VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    # Higher than the other services on purpose: unlike everything else in
    # this file, core's cgroup also covers every Tier 2/3 module's Deno
    # subprocess (they're spawned as children of this same container, see
    # internal/modules/deno.go's WorkerPool) - so this ceiling has to fit
    # Core itself plus however many modules are installed, not just one Go
    # binary. Raise it further if `docker stats` shows this container
    # pinned at the limit after installing several modules.
    mem_limit: 1g
    cpus: 2.0
    volumes:
      - modulab-modules-data:/var/lib/modulab/modules
      # MaxMind GeoLite2 City/ASN .mmdb files (internal/geoip), downloaded
      # and refreshed by Core itself once GeoIP is configured from the
      # admin panel (internal/setup/geoip.go) - no separate sidecar
      # container, no .env credentials. Named volume rather than a bind
      # mount so the databases survive a `docker compose pull && up -d`
      # core image upgrade the same way postgres-data/valkey-data do.
      # Path must match MODULAB_GEOIP_DATA_DIR's default in
      # internal/config/config.go (/data/geoip).
      - geoip-data:/data/geoip
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # Mirrors the Dockerfile's own HEALTHCHECK. Kept here as well because
      # Compose only recognizes a healthy/unhealthy state if a healthcheck
      # is defined (image-level or here, whichever Compose sees first), and
      # `docker compose ps` is the first place anyone looks when the site
      # stops answering.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Traefik routing. These labels sat on the nginx service until Core
    # started serving the frontend itself from the bundle embedded in its
    # binary (backend/internal/webui). nginx existed only to serve those
    # static files and proxy /v1/ back to Core, which made it a second
    # reverse proxy behind Traefik with nothing left to do - so the router
    # points here now and that service is gone, along with deploy/nginx.conf,
    # deploy/Dockerfile.nginx and the modulab-core-nginx image.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.modulab.rule=Host(`${MODULAB_DOMAIN}`)"
      - "traefik.http.routers.modulab.entrypoints=websecure"
      - "traefik.http.routers.modulab.tls.certresolver=le"
      # 8080, not 80 - this is Core's own listen port (see the Dockerfile's
      # EXPOSE and the healthcheck above); nginx listened on 80.
      - "traefik.http.services.modulab.loadbalancer.server.port=8080"
      # HSTS: main.go's commonSecHeaders doc comment says TLS-related
      # headers are "handled by Traefik at the edge" - found during the
      # pre-1.0.7 security pass that this was never actually configured, so
      # every response was silently missing Strict-Transport-Security.
      # 1 year (31536000s), no includeSubDomains and no preload
      # deliberately: this is a homelab single-domain deploy behind Let's
      # Encrypt, not a multi-subdomain estate, and HSTS preload is added to
      # a browser-shipped list that is extremely hard to reverse - not worth
      # that lock-in risk here.
      #
      # Both the middleware definition and the router that uses it have to
      # live on this service now. Traefik reads middleware definitions from
      # container labels, so leaving the definition behind on a service that
      # no longer exists would drop the header with no error anywhere - the
      # kind of regression nothing surfaces until someone checks the
      # response headers by hand.
      #
      # (The previous version of this comment said the middleware applied
      # "to both the modulab and searxng routers". That has been wrong since
      # 2026-07-23, when searxng lost its Traefik labels entirely - see that
      # service below.)
      - "traefik.http.middlewares.hsts.headers.stsSeconds=31536000"
      - "traefik.http.routers.modulab.middlewares=hsts"
    networks:
      - modulab-internal

  # ── SearXNG ───────────────────────────────────────────────────────────────────
  # SearXNG reuses ModuLab's Valkey instance (database index 1) to avoid a
  # second in-memory store. SearXNG namespaces its own keys so there is no
  # collision risk.
  #
  # settings.yml is bind-mounted directly (read-only) instead of being
  # templated in by a one-shot init container. That init-container approach
  # (sed-substituting SEARXNG_SECRET_KEY from .env into the searxng-data
  # volume before this service started) turned out unreliable on at least
  # one real deployment (Ugreen NAS, 2026-07-06) - the searxng-config
  # container failed to come up there. Editing deploy/searxng/settings.yml
  # directly with a real secret_key tested as reliable instead, so that's
  # the supported path now: before first start, replace the
  # "__SEARXNG_SECRET_KEY__" placeholder below with a real value
  # (`openssl rand -hex 32`) directly in that file. Since this file is
  # version-controlled, do not commit your real key back - keep the edit
  # local to your deployment.
  searxng:
    # Digest-pinned (2026-07-23 security pass) - was previously "latest"
    # with no version information at all, the worst case of the mutable-tag
    # risk described for the other services in this file. Bump deliberately.
    image: searxng/searxng:latest@sha256:02d441bbb647b7be422d21041420115cddadac4644368f67c7c7f407bbe72e22
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: https://${MODULAB_DOMAIN}/searxng/
      # Points at its own instance (searxng-valkey), not Core's. Was
      # redis://valkey:6379/1 until 2026-07-28 - see the searxng-valkey
      # service comment for why sharing an instance with Core's session
      # store was the actual problem, and why adding a password to the
      # shared one would not have solved it.
      SEARXNG_REDIS_URL: redis://searxng-valkey:6379/0
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on:
      searxng-valkey:
        condition: service_healthy
    healthcheck:
      # SearXNG's image is also Alpine-based; hits its own home page rather
      # than a dedicated /healthz (SearXNG has none) to confirm the app
      # server itself is answering, not just that the container started.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    # No Traefik labels here on purpose (2026-07-23 security pass): this
    # service used to be reachable at https://${MODULAB_DOMAIN}/searxng/
    # with no auth in front of it, while settings.yml below disables
    # SearXNG's own rate limiter - together that made it an open,
    # unauthenticated, unthrottled search proxy for anyone who found the
    # path. SearXNG only needs to be reachable from Core over
    # modulab-internal (see internal/searxng/searxng.go), never from the
    # public internet, so it now has no traefik.enable label at all - Core
    # reaches it directly via Docker's internal DNS (http://searxng:8080).
    # If a future need for public access ever comes up, put a
    # forwardAuth/basic-auth middleware in front of it and re-enable its
    # limiter in settings.yml before adding a router again.
    networks:
      - modulab-internal

networks:
  modulab-internal:
    # Explicit name prevents Docker Compose from prepending the project
    # directory name, which would break Traefik's --providers.docker.network.
    name: modulab-internal
    internal: false
  # Isolated network for Traefik <-> docker-socket-proxy only - nothing else
  # in this stack has (or needs) any reason to reach the socket proxy.
  # internal: true means this network has no outbound route at all, on top
  # of no other service being attached to it.
  docker-socket-proxy-internal:
    internal: true

volumes:
  postgres-data:
  valkey-data:
  traefik-acme:
  modulab-modules-data:
  geoip-data:
