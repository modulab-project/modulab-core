# ModuLab Core — self-hosted Docker stack
#
# Usage:
#   cd deploy/
#   cp .env.example .env   # fill in all required values
#   docker compose up -d
#   docker compose logs -f core

services:

  # ── Traefik (edge proxy + TLS) ───────────────────────────────────────────────
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=modulab-internal"
      # HTTPS entrypoint
      - "--entrypoints.websecure.address=:443"
      # Redirect plain HTTP → HTTPS
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt via Cloudflare DNS-Challenge.
      # External resolvers bypass Docker's internal DNS which cannot resolve
      # public ACME challenge records (_acme-challenge.<domain>).
      - "--certificatesresolvers.le.acme.dnschallenge=true"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Cloudflare API token — needs Zone:DNS:Edit permission for your domain.
      # Must be exactly 40 characters with no surrounding whitespace.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - modulab-internal

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - modulab-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Valkey ───────────────────────────────────────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - modulab-internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ModuLab Core ─────────────────────────────────────────────────────────────
  core:
    image: ghcr.io/modulab-project/modulab-core:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MODULAB_MODULE_DATA_DIR: /var/lib/modulab/modules
      MODULAB_PUBLIC_BASE_URL: https://${MODULAB_DOMAIN}
      MODULAB_FRONTEND_BASE_URL: https://${MODULAB_DOMAIN}
      MODULAB_DB_HOST: postgres
      MODULAB_DB_PORT: "5432"
      MODULAB_DB_NAME: ${POSTGRES_DB}
      MODULAB_DB_USER: ${POSTGRES_USER}
      MODULAB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      MODULAB_VALKEY_HOST: valkey
      MODULAB_VALKEY_PORT: "6379"
    volumes:
      - modulab-modules-data:/var/lib/modulab/modules
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # Mirrors the Dockerfile's own HEALTHCHECK; kept here too so
      # nginx's depends_on below can gate on condition: service_healthy —
      # Compose only recognizes a healthy/unhealthy state if a healthcheck
      # is defined (image-level or here), whichever Compose sees first.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - modulab-internal

  # ── Nginx (frontend + API proxy) ─────────────────────────────────────────────
  # Serves the pre-built frontend from the core image and proxies /v1/ to Core.
  # Core does not serve static files itself; nginx bridges that gap so that
  # frontend and API share the same origin without an extra subdomain.
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.modulab.rule=Host(`${MODULAB_DOMAIN}`)"
      - "traefik.http.routers.modulab.entrypoints=websecure"
      - "traefik.http.routers.modulab.tls.certresolver=le"
      - "traefik.http.services.modulab.loadbalancer.server.port=80"
    networks:
      - modulab-internal

  # ── SearXNG ───────────────────────────────────────────────────────────────────
  # SearXNG reuses ModuLab's Valkey instance (database index 1) to avoid a
  # second in-memory store. SearXNG namespaces its own keys so there is no
  # collision risk.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: https://${MODULAB_DOMAIN}/searxng/
      SEARXNG_REDIS_URL: redis://valkey:6379/1
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY}
    volumes:
      - searxng-data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on:
      - valkey
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`${MODULAB_DOMAIN}`) && PathPrefix(`/searxng`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.routers.searxng.tls.certresolver=le"
      - "traefik.http.middlewares.searxng-strip.stripprefix.prefixes=/searxng"
      - "traefik.http.routers.searxng.middlewares=searxng-strip"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    networks:
      - modulab-internal

networks:
  modulab-internal:
    # Explicit name prevents Docker Compose from prepending the project
    # directory name, which would break Traefik's --providers.docker.network.
    name: modulab-internal
    internal: false

volumes:
  postgres-data:
  valkey-data:
  traefik-acme:
  searxng-data:
  modulab-modules-data:
